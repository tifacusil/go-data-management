# golangci-lint v2. Linters estandar de correccion.
# misspell omitido: los comentarios estan en espanol (falsos positivos en_US).
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # Tests: permitir errores no chequeados en setup (sqlmock, etc).
      - path: _test\.go
        linters:
          - errcheck
